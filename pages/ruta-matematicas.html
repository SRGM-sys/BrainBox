<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Matemáticas - BrainBox</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/ruta.css">
</head>
<body>

    <!-- Cabecera -->
    <header class="top-nav" style="position: sticky; top: 0; z-index: 20; background-color: var(--surface-color); box-shadow: var(--shadow-sm); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="javascript:history.back()" class="back-btn" style="color: var(--text-muted); font-weight: 600; text-decoration: none;">← Volver</a>
        <h2 style="font-size: 1.2rem; margin: 0; color: var(--primary-color);">Ruta: Matemáticas</h2>
        <div style="width: 60px;"></div> <!-- Espaciador -->
    </header>

    <div class="path-bg">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
    </div>

    <main class="container path-container">
        <!-- Línea central que conecta todo -->
        <div class="path-line"></div>

        <!-- Módulo 1 -->
        <div class="node-wrapper pos-1">
            <div id="node-math_m1" class="module-node" onclick="handleNodeClick(this, 'modulo-math.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-1.png" alt="Proposiciones" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=1'">
                </div>
            </div>
            <span class="module-title">Proposiciones</span>
        </div>

        <!-- Módulo 2 -->
        <div class="node-wrapper pos-2">
            <div id="node-math_m2" class="module-node" data-requires="math_m1" onclick="handleNodeClick(this, 'modulo-math-2.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-2.png" alt="Conjuntos" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=2'">
                </div>
            </div>
            <span class="module-title">Conjuntos</span>
        </div>

        <!-- Módulo 3 al 10 (Bloqueados temporalmente para diseño) -->
        <div class="node-wrapper pos-3">
            <div id="node-math_m3" class="module-node locked" data-requires="math_m2" onclick="handleNodeClick(this, 'modulo-math-3.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-3.png" alt="Reales" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=3'">
                </div>
            </div>
            <span class="module-title">Números Reales</span>
        </div>

        <div class="node-wrapper pos-4">
            <div id="node-math_m4" class="module-node" data-requires="math_m3" onclick="handleNodeClick(this, 'modulo-math-4.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-4.png" alt="Funciones" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=4'">
                </div>
            </div>
            <span class="module-title">Funciones</span>
        </div>

        <<div class="node-wrapper pos-5">
            <div id="node-math_m5" class="module-node" data-requires="math_m4" onclick="handleNodeClick(this, 'modulo-math-5.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-5.png" alt="Trigonometría" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=5'">
                </div>
            </div>
            <span class="module-title">Trigonometría</span>
        </div>

        <div class="node-wrapper pos-6">
            <div id="node-math_m6" class="module-node" data-requires="math_m5" onclick="handleNodeClick(this, 'modulo-math-6.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-6.png" alt="Números Complejos" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=6'">
                </div>
            </div>
            <span class="module-title">Números Complejos</span>
        </div>

        <div class="node-wrapper pos-7">
            <div id="node-math_m7" class="module-node" data-requires="math_m6" onclick="handleNodeClick(this, 'modulo-math-7.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-7.png" alt="Matrices" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=7'">
                </div>
            </div>
            <span class="module-title">Matrices</span>
        </div>

        <div class="node-wrapper pos-8">
            <div class="module-node locked">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-8.png" alt="img" class="module-img">
                </div>
            </div>
            <span class="module-title">Geometria Plana</span>
        </div>

        <div class="node-wrapper pos-9">
            <div class="module-node locked">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-9.png" alt="img" class="module-img">
                </div>
            </div>
            <span class="module-title">Geometria en el Espacio</span>
        </div>

        <div class="node-wrapper pos-10">
            <div class="module-node locked boss-node">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/math-10.png" alt="img" class="module-img">
                </div>
            </div>
            <span class="module-title">Geometría Analítica</span>
        </div>
        
        <div style="height: 40px;"></div>
    </main>


    <!-- EL SCRIPT MÁGICO QUE FALTABA -->
    <script src="../js/ruta.js"></script>

</body>
</html>

                        </div>

                    <!-- Tema 2 -->
                    <div class="topic-card" data-topic="tema2" onclick="openTopic('tema2')">

    <!-- DATOS DEL MÓDULO -->
    <script>
        window.moduleId = "math_m7"; // Identificador único del Módulo 7 de Matemáticas

        window.moduleData = {
            "tema1": {
                title: "Transpuesta y Traza",
                reading: `
                    <br>
                    <h4>Modificando el arreglo bidimensional</h4>
                    <p>Una matriz es una cuadrícula de números. Existen dos operaciones básicas muy útiles:</p>
                    <ul>
                        <li><b>La Transpuesta (A<sup>T</sup>):</b> Consiste en intercambiar las filas por las columnas. Lo que estaba acostado, ahora se pone de pie. Si tu matriz era de tamaño 2x3 (2 filas, 3 columnas), su transpuesta será de 3x2.</li>
                        <li><b>La Traza, Tr(A):</b> Solo aplica para matrices cuadradas (mismo número de filas y columnas). Es simplemente la <b>suma de los elementos de la diagonal principal</b> (los que van desde la esquina superior izquierda hasta la inferior derecha).</li>
                    </ul>
                `,
                questions: [
                    { id: "math_m7_t1_q1", text: "Si aplicas la transpuesta a una matriz, ¿qué ocurre con sus elementos?", options: ["Se multiplican por -1.", "Las filas se convierten en columnas.", "Se suman todos entre sí.", "La matriz se vuelve cuadrada."], correctIndex: 1 },
                    { id: "math_m7_t1_q2", text: "Si tienes una matriz de dimensiones 4x5 y calculas su transpuesta, ¿de qué tamaño será la nueva matriz?", options: ["4x5", "5x4", "9x9", "4x4"], correctIndex: 1 },
                    { id: "math_m7_t1_q3", text: "¿Qué elementos debes sumar para calcular la Traza de una matriz cuadrada?", options: ["Todos los elementos de la matriz.", "Los elementos de la última fila.", "Los elementos de la diagonal principal.", "Los elementos de la primera columna."], correctIndex: 2 }
                ]
            },
            "tema2": {
                title: "El Determinante de una Matriz",
                reading: `
                    <br>
                    <h4>El número que lo define todo</h4>
                    <p>El <b>Determinante</b> es un valor escalar especial que solo se puede calcular en <b>matrices cuadradas</b> (2x2, 3x3, etc.). Se denota como det(A) o |A|.</p>
                    <p>Para una matriz básica de 2x2 con elementos [a, b] en la primera fila y [c, d] en la segunda, la fórmula es cruzada: <b>det(A) = (a·d) - (b·c)</b>.</p>
                    <p><b>El dato vital:</b> Si el determinante de una matriz es igual a <b>cero</b>, significa que la matriz "colapsa" el espacio y <b>NO tiene inversa</b>. Se le llama matriz singular.</p>
                `,
                questions: [
                    { id: "math_m7_t2_q1", text: "¿A qué tipo de matrices se les puede calcular el determinante?", options: ["A cualquier matriz.", "Solo a matrices cuadradas.", "Solo a matrices transpuestas.", "Solo a matrices de 1x1."], correctIndex: 1 },
                    { id: "math_m7_t2_q2", text: "¿Cuál es la fórmula para calcular el determinante de una matriz 2x2 con elementos a, b, c, d?", options: ["(a·c) - (b·d)", "(a·d) + (b·c)", "(a·d) - (b·c)", "a + b + c + d"], correctIndex: 2 },
                    { id: "math_m7_t2_q3", text: "Si el determinante de una matriz es exactamente CERO, podemos asegurar que:", options: ["La matriz es la Identidad.", "La matriz NO tiene inversa (es singular).", "La matriz solo tiene números negativos.", "La traza también es cero."], correctIndex: 1 }
                ]
            },
            "tema3": {
                title: "Operaciones Elementales",
                reading: `
                    <br>
                    <h4>Escalando Filas y Columnas</h4>
                    <p>Para resolver sistemas de ecuaciones o encontrar inversas, a menudo necesitamos "manipular" la matriz usando las tres <b>Operaciones Elementales de Fila</b> (o columna):</p>
                    <ol>
                        <li><b>Intercambio:</b> Puedes cambiar de posición dos filas enteras.</li>
                        <li><b>Escalado (Multiplicación):</b> Puedes multiplicar todos los números de una fila por un número real (escalar) que no sea cero. (Ej: Multiplicar la fila 1 por 5).</li>
                        <li><b>Suma de filas:</b> Puedes sumarle a una fila el múltiplo de otra fila distinta.</li>
                    </ol>
                    <p>Estas reglas son la base del famoso método de <b>Eliminación de Gauss-Jordan</b>.</p>
                `,
                questions: [
                    { id: "math_m7_t3_q1", text: "Al realizar un 'escalado' como operación elemental de fila, ¿qué estamos haciendo?", options: ["Multiplicar una fila entera por un escalar (número) distinto de cero.", "Elevar al cuadrado toda la matriz.", "Dividir la matriz a la mitad.", "Borrar una fila entera."], correctIndex: 0 },
                    { id: "math_m7_t3_q2", text: "¿Es válido sumar una fila con otra dentro de las operaciones elementales?", options: ["No, solo se puede restar.", "Sí, es una de las operaciones permitidas.", "Solo si la matriz es 2x2.", "No, arruinaría el determinante irreversiblemente."], correctIndex: 1 },
                    { id: "math_m7_t3_q3", text: "¿Qué famoso algoritmo utiliza exhaustivamente estas operaciones de fila para resolver sistemas de ecuaciones lineales?", options: ["Teorema de Pitágoras.", "Eliminación de Gauss-Jordan.", "Regla de Ruffini.", "Fórmula General."], correctIndex: 1 }
                ]
            }
        };
    </script>

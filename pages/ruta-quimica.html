<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Química - BrainBox</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/ruta.css">
</head>
<body>

    <!-- Cabecera -->
    <header class="top-nav" style="position: sticky; top: 0; z-index: 20; background-color: var(--surface-color); box-shadow: var(--shadow-sm); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="javascript:history.back()" class="back-btn" style="color: var(--text-muted); font-weight: 600; text-decoration: none;">← Volver</a>
        <h2 style="font-size: 1.2rem; margin: 0; color: var(--primary-color);">Ruta: Química</h2>
        <div style="width: 60px;"></div> <!-- Espaciador -->
    </header>

    <div class="path-bg">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
    </div>

    <main class="container path-container">
        <!-- Línea central que conecta todo -->
        <div class="path-line"></div>

        <!-- Módulo 1 -->
        <div class="node-wrapper pos-1">
            <!-- AQUÍ LOS ATRIBUTOS MÁGICOS -->
            <div id="node-chem_m1" class="module-node" onclick="handleNodeClick(this, 'modulo-chem.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-1.png" alt="Teoría Atómica" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=1'">
                </div>
            </div>
            <span class="module-title">Teoría Atómica</span>
        </div>

        <!-- Módulo 2 -->
        <div class="node-wrapper pos-2">
            <!-- ACTUALIZAMOS ESTE DIV PARA CONECTAR EL MÓDULO 2 -->
            <div id="node-chem_m2" class="module-node" data-requires="chem_m1" onclick="handleNodeClick(this, 'modulo-chem-2.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-2.png" alt="Estructuras de Lewis" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=2'">
                </div>
            </div>
            <span class="module-title">Estructuras de Lewis</span>
        </div>

        <!-- Módulo 3 -->
        <div class="node-wrapper pos-3">
            <!-- ASIGNAMOS EL ID, EL REQUISITO Y EL ENLACE AL MÓDULO 3 -->
            <div id="node-chem_m3" class="module-node" data-requires="chem_m2" onclick="handleNodeClick(this, 'modulo-chem-3.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-3.png" alt="Enlaces Químicos" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=3'">
                </div>
            </div>
            <span class="module-title">Enlaces Químicos</span>
        </div>

        <!-- Módulo 4 (ACTIVO AUTOMÁTICO VÍA JS) -->
        <div class="node-wrapper pos-4">
            <!-- AQUÍ EL ENLACE MÁGICO AL MÓDULO 4 -->
            <div id="node-chem_m4" class="module-node" data-requires="chem_m3" onclick="handleNodeClick(this, 'modulo-chem-4.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-4.png" alt="Geometría Molecular" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=4'">
                </div>
            </div>
            <span class="module-title">Geometría Molecular</span>
        </div>

        <!-- Módulo 5 -->
        <div class="node-wrapper pos-5">
            <!-- AQUÍ EL ENLACE MÁGICO AL MÓDULO 5 DE QUÍMICA -->
            <div id="node-chem_m5" class="module-node" data-requires="chem_m4" onclick="handleNodeClick(this, 'modulo-chem-5.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-5.png" alt="Geometría de Dominio" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=5'">
                </div>
            </div>
            <span class="module-title">Geometría de Dominio</span>
        </div>

        <!-- Módulo 6 (BLOQUEADO) -->
        <div class="node-wrapper pos-6">
            <div class="module-node locked">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-6.png" alt="img" class="module-img">
                </div>
            </div>
            <span class="module-title">Estequiometria</span>
        </div>

        <!-- Módulo 7 (BLOQUEADO) -->
        <div class="node-wrapper pos-7">
            <div class="module-node locked">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/chem-7.png" alt="img" class="module-img">
                </div>
            </div>
            <span class="module-title">Gases</span>
        </div>
        
        <!-- Espacio extra al final para que el último nodo no quede pegado al menú -->
        <div style="height: 40px;"></div>
    </main>

    <script src="../js/ruta.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Profesor - BrainBox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .teacher-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        /* --- MAGIA 3D: EL CONTENEDOR Y LA TARJETA QUE GIRA --- */
        .student-card-wrapper {
            perspective: 1000px;
            min-height: 340px; /* Forzamos una altura para que ambas caras quepan bien */
        }

        .student-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efecto de rebote al girar */
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .student-card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .student-card-front, .student-card-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: var(--surface-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .student-card-wrapper:hover .student-card-front,
        .student-card-wrapper:hover .student-card-back {
            border-color: rgba(108, 92, 231, 0.4);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.15);
        }

        /* Frontal */
        .student-card-front {
            gap: 12px;
        }

        /* Trasera (Dorso) */
        .student-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(to bottom right, #ffffff, #F8F9FC);
        }

        /* --- INTERIORES DE LA TARJETA --- */
        .student-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }
        .student-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
        }
        .student-info h4 { margin: 0; font-size: 1.1rem; color: var(--text-main); }
        .student-info p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
        
        .subject-progress {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .bar-bg {
            background: #E2E8F0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease-out;
        }
        .fill-math { background: #6C5CE7; }
        .fill-phys { background: #00CEC9; }
        .fill-chem { background: #44BD6E; }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        /* Animación para el aviso de girar */
        .bounce-hint {
            display: inline-block;
            animation: bounceHorizontal 1.5s infinite;
        }
        @keyframes bounceHorizontal {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <header class="teacher-header">
        <h2 style="margin: 0;">Panel de Control</h2>
        <button onclick="window.location.href='../index.html'" style="background: rgba(255, 123, 123, 0.2); border: none; color: rgb(233, 79, 79); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold;">Salir</button>
    </header>

    <main class="container">
        <div style="padding: 20px 20px 0;">
            <h3 style="color: var(--text-main);">Avance de Estudiantes</h3>
            <p style="color: var(--text-muted);">Toca cualquier tarjeta para girarla y ver el Top 3 de carreras.</p>
        </div>

        <div id="students-container" class="students-grid">
            <!-- Las tarjetas de los estudiantes se inyectarán aquí -->
        </div>
    </main>

    <script src="../js/profesor.js"></script>
</body>
</html>

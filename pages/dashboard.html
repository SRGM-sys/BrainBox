<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BrainBox</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <!-- Barra Superior (Estilo Gamificado Compacto) -->
    <header class="dashboard-header">
        <div class="greeting-row">
            <h2 id="user-greeting">¡Hola, Cargando...! 👋</h2>
            <div class="header-actions">
                <!-- Botón de Cerrar Sesión Rojito -->
                <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
            </div>
        </div>

        <!-- Fila de Estadísticas (2 Columnas) -->
        <div class="stats-row">
            
            <!-- Mitad 1: Nivel y Experiencia -->
            <div class="level-card">
                <div class="level-info">
                    <div class="avatar-img" id="user-avatar-container"></div>
                    <div class="level-text">
                        <div class="level-title">Nivel 1</div>
                        <div class="level-subtitle">Explorador</div>
                    </div>
                </div>
                <div class="progress-section">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <div class="xp-text">150 / 500</div>
                </div>
            </div>

            <!-- Mitad 2: Racha Diaria -->
            <div class="streak-section">
                <div class="streak-header">
                    <span class="streak-title">Racha 🔥</span>
                    <span class="streak-days">3 días</span>
                </div>
                <div class="days-row">
                    <div class="day-item completed"><div class="circle">✓</div><span class="day-label">L</span></div>
                    <div class="day-item completed"><div class="circle">✓</div><span class="day-label">M</span></div>
                    <div class="day-item completed"><div class="circle">✓</div><span class="day-label">X</span></div>
                    <div class="day-item"><div class="circle"></div><span class="day-label">J</span></div>
                    <div class="day-item"><div class="circle"></div><span class="day-label">V</span></div>
                    <div class="day-item"><div class="circle"></div><span class="day-label">S</span></div>
                    <div class="day-item"><div class="circle"></div><span class="day-label">D</span></div>
                </div>
            </div>

        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">
        <h2 class="section-title">Elige una materia</h2>
        
        <div class="subject-grid">
            <div class="subject-card">
                <div class="subject-icon">📐</div>
                <h3>Matemáticas</h3>
            </div>
            
            <div class="subject-card">
                <div class="subject-icon">⚛️</div>
                <h3>Física</h3>
            </div>
            
            <div class="subject-card">
                <div class="subject-icon">🧪</div>
                <h3>Química</h3>
            </div>
        </div>

        <div class="challenge-card">
            <div>
                <h3>Retos Combinados</h3>
                <p style="font-size: 0.9rem; opacity: 0.9;">Preguntas aleatorias de lo que ya sabes.</p>
            </div>
            <div style="font-size: 2rem;">🧠</div>
        </div>
    </main>

    <!-- Navegación Inferior Compacta -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='dashboard.html'">
            <span class="nav-icon">🏠</span>
            <span>Principal</span>
        </div>
        <div class="nav-item" onclick="window.location.href='canjeo.html'">
            <span class="nav-icon">🎁</span>
            <span>Canjeo</span>
        </div>
        <div class="nav-item" onclick="window.location.href='perfil.html'">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </div>
    </nav>

    <!-- Script del Dashboard -->
    <script src="../js/dashboard.js"></script>
</body>
</html>

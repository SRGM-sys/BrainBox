<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Física - BrainBox</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/ruta.css">
</head>
<body>

    <!-- Cabecera -->
    <header class="top-nav" style="position: sticky; top: 0; z-index: 20; background-color: var(--surface-color); box-shadow: var(--shadow-sm); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="dashboard.html" class="back-btn" style="color: var(--text-muted); font-weight: 600; text-decoration: none;">← Volver</a>
        <h2 style="font-size: 1.2rem; margin: 0; color: var(--primary-color);">Ruta: Física</h2>
        <div style="width: 60px;"></div> <!-- Espaciador -->
    </header>

    <div class="path-bg">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
    </div>

    <main class="container path-container">
        <!-- Línea central que conecta todo -->
        <div class="path-line"></div>

        <!-- Módulo 1 (Corregido a pos-1 y Mediciones) -->
        <div class="node-wrapper pos-1">
            <div id="node-phys_m1" class="module-node" onclick="handleNodeClick(this, 'modulo-phys.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/phys-1.png" alt="Mediciones" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=1'">
                </div>
            </div>
            <span class="module-title">Mediciones</span>
        </div>

        <!-- Módulo 2 -->
        <div class="node-wrapper pos-2">
            <div id="node-phys_m2" class="module-node" data-requires="phys_m1" onclick="handleNodeClick(this, 'modulo-phys-2.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/phys-2.png" alt="Vectores" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=2'">
                </div>
            </div>
            <span class="module-title">Vectores</span>
        </div>

        <!-- Módulo 3 -->
        <div class="node-wrapper pos-3">
            <div id="node-phys_m3" class="module-node locked" data-requires="phys_m2" onclick="handleNodeClick(this, 'modulo-phys-3.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/phys-3.png" alt="Cinemática 1D" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=3'">
                </div>
            </div>
            <span class="module-title">Cinemática 1D</span>
        </div>

        <!-- Módulo 4 -->¿
        <div class="node-wrapper pos-4">
            <!-- Añadimos el ID, el REQUISITO de la medalla phys_m3 y la ruta de destino -->
            <div id="node-phys_m4" class="module-node" data-requires="phys_m3" onclick="handleNodeClick(this, 'modulo-phys-4.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/phys-4.png" alt="Cinemática 2D" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=4'">
                </div>
            </div>
            <span class="module-title">Cinemática 2D</span>
        </div>

        <!-- Módulo 5 -->
        <div class="node-wrapper pos-5">
            <!-- AQUÍ EL ENLACE MÁGICO AL MÓDULO 5 -->
            <div id="node-phys_m5" class="module-node" data-requires="phys_m4" onclick="handleNodeClick(this, 'modulo-phys-5.html')">
                <div class="icon-container">
                    <span class="lock-icon">🔒</span>
                    <img src="../assets/icons/phys-5.png" alt="Leyes de Newton" class="module-img" onerror="this.src='https://placehold.co/100x100/transparent/FFFFFF?text=5'">
                </div>
            </div>
            <span class="module-title">Leyes de Newton</span>
        </div>
        
        <div style="height: 40px;"></div>
    </main>


    <!-- SCRIPT DE RUTA VITAL PARA LOS CANDADOS -->
    <script src="../js/ruta.js"></script>

</body>
</html>
